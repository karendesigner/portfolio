<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="only light">
<title>Investment App desktop overview</title>
<style>
:root{--body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:only light}
*{box-sizing:border-box}
body{margin:0;background:transparent;overflow:hidden;color:#121318;font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.rv{max-width:1360px;margin:0 auto;padding:28px 24px 48px}
.rv h1{font-size:22px;font-weight:600;margin:0 0 4px}
.rv .lead{color:#5B6070;margin:0 0 4px;font-size:14px}
.rv .ver{font:12px var(--mono);color:#0874A3;margin-bottom:16px}
.frame{width:1312px;border-radius:12px;overflow:hidden;border:1px solid #D8DBE2;background:#fff}
.chrome{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#E9EBEF;border-bottom:1px solid #D8DBE2;min-width:1160px}
.chrome i{width:11px;height:11px;border-radius:50%;background:#FF5F57;display:block}.chrome i:nth-child(2){background:#FEBC2E}.chrome i:nth-child(3){background:#28C840}
.chrome .url{margin-left:14px;flex:1;max-width:460px;background:#fff;border-radius:7px;padding:4px 12px;font-size:12px;color:#5B6070}

.dk{min-width:1160px;height:760px;display:grid;grid-template-columns:208px minmax(0,1fr);font-size:14px;line-height:1.4;background:var(--pp-bg);color:var(--pp-text);position:relative}
.dk-side{border-right:1px solid var(--pp-line);padding:20px 14px;display:flex;flex-direction:column;gap:2px}
.dk-logo{display:flex;align-items:center;gap:9px;font-weight:500;letter-spacing:.04em;font-size:14px;padding:4px 10px 22px}
.dk-logo svg{color:var(--pp-red)}
.dk .dk-nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--pp-muted);width:100%;font-size:14px}
.dk .dk-nav:hover{background:var(--pp-surface);color:var(--pp-text)}
.dk .dk-nav[aria-current="page"]{background:var(--pp-surface);color:var(--pp-text);font-weight:600}
.dk .dk-nav .cnt{margin-left:auto;font-size:11.5px;background:var(--pp-text);color:var(--pp-bg);border-radius:99px;padding:1px 7px;font-weight:600}
.dk-sp{flex:1}
.dk-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.dk-top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--pp-line);position:relative;z-index:4}
.dk-q{flex:1;max-width:460px;position:relative}
.dk-q label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--pp-line);border-radius:99px;padding:8px 14px;color:var(--pp-muted)}
.dk-q label:focus-within{border-color:var(--pp-text)}
.dk-q input{border:0;outline:none;font:inherit;flex:1;min-width:0;color:var(--pp-text);background:none}
.dk-dd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--pp-bg);border:1px solid var(--pp-line);border-radius:12px;box-shadow:0 18px 40px -18px rgba(0,0,0,.3);padding:6px 0;max-height:360px;overflow:auto}
.dk-dd .h{padding:6px 14px;font-size:12px;color:var(--pp-muted)}
.dk .dk-dd button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px}
.dk .dk-dd button:hover{background:var(--pp-surface)}
.dk-dd .n{flex:1;min-width:0}.dk-dd .n b{display:block;font-weight:500}.dk-dd .n span{font-size:12px;color:var(--pp-muted)}
.dk-dd .p{text-align:right;font-size:13px}.dk-dd .p span{display:block;font-size:12px}
.dk-tsp{flex:1}
.dk .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 18px;border-radius:99px;font-weight:600;font-size:14px;border:1.5px solid var(--pp-text);white-space:nowrap}
.dk .btn.fill{background:var(--pp-text);color:var(--pp-bg)}
.dk .btn.sm{height:32px;padding:0 14px;font-size:13px}
.dk .btn.wide{width:100%;height:44px;font-size:15px}
.dk .acct{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:99px;border:1px solid var(--pp-line)}
.acct .av{width:30px;height:30px;border-radius:50%;background:var(--pp-surface);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.dk-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px}
.dk-body.full{grid-template-columns:minmax(0,1fr)}
.dk-c{overflow-y:auto;padding:24px 28px 40px;min-width:0}
.dk-r{border-left:1px solid var(--pp-line);overflow-y:auto;padding:22px 20px 32px;display:flex;flex-direction:column;gap:18px}
.dk h2{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.dk h3{font-size:16px;font-weight:600;margin:0}
.mu{color:var(--pp-muted)}.sm{font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--pp-surface);border-radius:12px;padding:14px 16px}
.kpi span{display:block;font-size:12.5px;color:var(--pp-muted)}
.kpi b{display:block;font-size:22px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card{border:1px solid var(--pp-line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.rng{display:flex;gap:2px}
.dk .rng button{padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--pp-muted)}
.dk .rng button[aria-selected="true"]{background:var(--pp-text);color:var(--pp-bg);font-weight:600}
.lchart{width:100%;height:auto;display:block;cursor:crosshair;touch-action:none}
.lchart .gl{stroke:var(--pp-line)}.lchart .ax{font:11px var(--body);fill:var(--pp-muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:500;font-size:12px;color:var(--pp-muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--pp-line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.dk .tbl th button{font-weight:500;color:inherit}
.dk .tbl th button[aria-sort]{color:var(--pp-text)}
.tbl td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--pp-line);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#FAFAFA}
.tbl tbody tr.sel td{background:var(--pp-surface)}
.tbl tr:last-child td{border-bottom:0}
.co{display:flex;align-items:center;gap:10px}.co b{font-weight:500}.co small{display:block;color:var(--pp-muted);font-size:12px}
.co .pp-ic{width:32px;height:32px;flex:none}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--pp-surface);font-weight:500}
.tag.ok{color:var(--pp-up)}.tag.cx{color:var(--pp-muted)}
.seg{display:inline-flex;background:var(--pp-surface);border-radius:99px;padding:3px}
.dk .seg button{padding:6px 16px;border-radius:99px;font-size:13px;color:var(--pp-muted)}
.dk .seg button[aria-selected="true"]{background:var(--pp-bg);color:var(--pp-text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rv-h{display:flex;align-items:center;gap:12px}
.rv-h .pp-ic{width:40px;height:40px;font-size:15px}
.ordl{display:flex;flex-direction:column}
.dk .ordl button{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--pp-line);width:100%;font-size:13px}
.ordl button:last-child{border-bottom:0}
.empty{padding:28px 0;text-align:center;color:var(--pp-muted)}
.hi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 26px}
.dk .hi .pp-icard{width:auto;height:150px;border-radius:12px}
.opps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.dk .opps .pp-opp{width:100%}
.dk .opps .pp-opp[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--pp-text)}
.bc{font-size:13px;color:var(--pp-muted);margin-bottom:10px}
.dk .bc button{color:var(--pp-muted)}.dk .bc button:hover{color:var(--pp-text);text-decoration:underline}
.mh{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.mh .pp-ic{width:46px;height:46px;font-size:17px}
.mh .px{font-size:26px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.dk .md-tabs{margin:14px 0 4px;padding-top:0}
.mdb{max-width:760px}
.mdb .md-pad{padding:6px 0 10px}
.mdb .md-svg{max-width:560px;margin-left:auto;margin-right:auto}
.mdb .md-cards.c2,.mdb .md-cards.c3{max-width:640px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.tk h3{display:flex;justify-content:space-between;align-items:center}
.tk .seg{display:flex}.dk .tk .seg button{flex:1}
.amt{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1.5px solid var(--pp-line);border-radius:12px;padding:8px}
.dk .amt button{width:32px;height:32px;border-radius:50%;border:1px solid var(--pp-line);font-size:18px;display:flex;align-items:center;justify-content:center}
.amt b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px}
.dk .chips button{flex:1;border:1px solid var(--pp-line);border-radius:99px;padding:6px 0;font-size:12.5px;text-align:center}
.dk .chips button[aria-pressed="true"]{border-color:var(--pp-text);font-weight:600}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--pp-line);font-size:13.5px}
.kv div:last-child{border-bottom:0}.kv span{color:var(--pp-muted)}
.kv .tot{font-weight:600}.kv .tot span{color:var(--pp-text)}
.done{text-align:center;padding:10px 0}
.done i{width:48px;height:48px;border-radius:50%;background:var(--pp-up);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;margin-bottom:8px}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20}
.modal .box{background:var(--pp-bg);border-radius:16px;padding:22px 24px;width:440px;max-height:86%;overflow:auto;position:relative}
.modal .box h5{font-size:19px;font-weight:700;margin:0 0 8px}
.modal .box h6{font-size:14.5px;font-weight:600;margin:12px 0 2px}
.modal .box p{margin:0 0 6px;font-size:14px}
.dk .modal .x{position:absolute;right:16px;top:16px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.dk-toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1C1C1E;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;display:flex;gap:8px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.dk-toast{white-space:nowrap}
.dk-toast.show{opacity:1;transform:translateX(-50%)}
.dk-toast i{width:18px;height:18px;border-radius:50%;background:var(--pp-up);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
.note{margin-top:14px;font-size:13px;color:#5B6070}
.hrow-x td{background:var(--pp-surface)!important;cursor:default}

/* shared mobile components */
/* ===== IG prototype ===== */
.pp{display:grid;grid-template-columns:350px 1fr;gap:32px;align-items:start;margin:var(--s4) 0 var(--s5)}
@media (max-width:760px){.pp{grid-template-columns:1fr;justify-items:center}.pp-side{width:100%;max-width:400px}}
.dk{--pp-bg:#FFFFFF;--pp-surface:#F5F5F6;--pp-text:#171717;--pp-muted:#707379;--pp-line:#EDEDEF;--pp-teal:#000000;--pp-teal-ink:#000000;--pp-on-teal:#FFFFFF;--pp-up:#1E9E3F;--pp-down:#E0261B;--pp-red:#E3262A;--pp-ai1:#8B45F0;--pp-ai2:#E0264C;
}
.dk[data-theme="dark"]{--pp-bg:#171717;--pp-surface:#222223;--pp-text:#D4D4D4;--pp-muted:#9B9EA4;--pp-line:#2A2A2C;--pp-teal:#FFFFFF;--pp-teal-ink:#FFFFFF;--pp-on-teal:#000000;--pp-up:#4FC46B;--pp-down:#FF6A5C;--pp-ai1:#B38BFF;--pp-ai2:#FF6A86}
.dk *{box-sizing:border-box}
.dk button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
.dk button:focus-visible,.dk input:focus-visible{outline:2px solid var(--pp-teal);outline-offset:2px;border-radius:6px}
.dk::after{content:"";position:absolute;left:50%;bottom:7px;width:128px;height:4.5px;border-radius:3px;background:var(--pp-text);transform:translateX(-50%);z-index:6;opacity:.9}
.dk.photo::after{background:#171717}
.pp-screen{position:absolute;inset:0 0 82px 0;overflow-y:auto;scrollbar-width:none}
.dk.no-nav .pp-screen{bottom:0}
.pp-sbar{position:absolute;top:0;left:0;right:0;z-index:6;background:var(--pp-bg)}
.pp-sbar .pp-status{position:static;height:44px;box-sizing:border-box}
.dk:not(.photo) .pp-screen{top:44px}
.dk.photo .pp-sbar{display:none}
.pp-screen .pp-status:not(.on-photo){display:none}
.pp-screen::-webkit-scrollbar{display:none}
.pp-view{min-height:100%;position:relative}
.pp-anim{animation:ppin .26s ease both}
@keyframes ppin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.pp-anim{animation:none}}
.pp-status{display:flex;justify-content:space-between;align-items:center;padding:16px 26px 8px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.pp-status.on-photo{color:#fff;position:absolute;top:0;left:0;right:0}
.pp-status:not(.on-photo){position:sticky;top:0;z-index:5;background:var(--pp-bg)}
.pp-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px;min-height:46px}
.pp-head.brand{padding:10px 20px 14px}
.pp-head .chev{color:var(--pp-muted)}
.pp-logo{display:flex;align-items:center;gap:9px;font-weight:500;letter-spacing:.03em;font-size:14.5px}
.pp-logo .iglogo{color:var(--pp-red);flex:none}
.dk .pp-acct{width:100%;text-align:left}
.pp-acct .chev{color:var(--pp-text);transition:transform .2s}
.pp-acct[aria-expanded="true"] .chev{transform:rotate(180deg)}
.pp-acs{display:grid;gap:0;margin:2px -16px 0}
.dk .pp-acs button{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--pp-line);text-align:left;width:100%}
.pp-acs .ai2{width:36px;height:36px;border-radius:50%;background:var(--pp-surface);display:flex;align-items:center;justify-content:center;flex:none;color:var(--pp-red)}
.pp-acs b{display:block;font-weight:600;font-size:14.5px}
.pp-acs small{color:var(--pp-muted);font-size:12.5px}
.pp-acs .ck{margin-left:auto;color:var(--pp-teal-ink);font-weight:700}
.pp-title{font-weight:600;font-size:16.5px;text-align:center;flex:1}
.pp-back{width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.pp-back:hover{background:var(--pp-surface)}
.pp-tabs{display:flex;border-bottom:1px solid var(--pp-line)}
.pp-tabs button{flex:1;padding:4px 0 11px;font-size:13.5px;color:var(--pp-muted);border-bottom:2px solid transparent;text-align:center}
.pp-tabs button[aria-selected="true"]{color:var(--pp-text);font-weight:600;border-bottom-color:var(--pp-text)}
.up{color:var(--pp-up)}.down{color:var(--pp-down)}
.dk .pp-row{display:flex;align-items:center;gap:11px;padding:13px 16px 13px 18px;border-bottom:1px solid var(--pp-line);width:100%}
button.pp-row:hover{background:var(--pp-surface)}
.pp-ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;letter-spacing:-.03em}
.pp-ic.sm{font-size:8.5px}
.pp-ic.ring{box-shadow:inset 0 0 0 1px var(--pp-line)}
.pp-row .n{flex:1;min-width:0;display:flex;flex-direction:column}
.pp-row .n b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-row .n span{color:var(--pp-muted);font-size:12.5px;line-height:1.45}
.pp-row .n span+span{font-size:11.5px}
.pp-row .p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;display:flex;flex-direction:column;gap:2px}
.pp-row .p b{font-weight:600;font-size:14.5px}
.pp-row .p b.reg{font-weight:400}
.pp-row .p span{font-size:11px;color:var(--pp-muted)}
.pp-row .p span i{font-style:normal}
.pp-row .chev{color:var(--pp-muted);flex:none}
.pp-hold.open .chev{transform:rotate(180deg)}
.pp-hold.open .pp-row{border-bottom-color:transparent}
.pp-exp{padding:0 41px 14px 55px;border-bottom:1px solid var(--pp-line);display:grid;gap:7px;font-size:13px}
.pp-exp div{display:flex;justify-content:space-between}
.pp-exp span{color:var(--pp-muted)}
.pp-exp b{font-weight:500;font-variant-numeric:tabular-nums}
.pp-exp .acts{gap:8px;margin-top:4px}
.pp-empty{padding:36px 24px;color:var(--pp-muted);text-align:center;font-size:13.5px}
.pp-search{display:flex;align-items:center;gap:12px;margin:10px 16px 18px}
.pp-field{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:2px solid var(--pp-teal);border-radius:18px;padding:10px 12px;color:var(--pp-muted)}
.pp-field input{flex:1;min-width:0;border:0;background:none;color:var(--pp-text);font:inherit;font-size:15px;outline:none;padding:0}
.pp-field input::placeholder{color:var(--pp-muted)}
.pp-field input::-webkit-search-cancel-button{-webkit-appearance:none}
.pp-search .cancel{font-weight:600;font-size:15px;flex:none}
.pp-sec{padding:0 18px 4px;color:var(--pp-muted);font-size:14px}
.pp-md{padding:4px 18px 0}
.pp-md h5{margin:0;font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pp-md h5 small{font-weight:400;color:var(--pp-muted);font-size:12.5px}
.pp-chip{font-size:11.5px;padding:3px 8px;border-radius:5px;background:var(--pp-surface);color:var(--pp-muted);font-weight:500;margin-left:4px}
.pp-md .px{font-size:13.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.pp-sub{display:flex;gap:2px;padding:14px 0 0;border-bottom:1px solid var(--pp-line);font-size:13.5px;overflow:hidden}
.pp-sub button{padding:0 12px 10px;color:var(--pp-muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border-bottom:2px solid transparent}
.pp-sub button[aria-selected="true"]{color:var(--pp-text);font-weight:600;border-bottom-color:var(--pp-text)}
.pp-sub button.ai{background:linear-gradient(90deg,var(--pp-ai1),var(--pp-ai2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pp-sub button.ai[aria-selected="true"]{border-image:linear-gradient(90deg,var(--pp-ai1),var(--pp-ai2)) 1;border-bottom:2px solid}
.pp-chart{padding:14px 6px 0 12px;touch-action:none;cursor:crosshair}
.pp-chart svg{width:100%;height:auto;display:block;overflow:visible}
.pp-chart .gl{stroke:var(--pp-line);stroke-width:1}
.pp-chart .ax{font:500 8.5px var(--body);fill:var(--pp-muted)}
.pp-chart .ax-ic{color:var(--pp-muted)}
.pp-chart .tg{font:600 8px var(--body);fill:#fff}
.pp-chart .tg.s{font-weight:500;font-size:7px}
.pp-about{padding:18px 18px 100px}
.pp-about h6{margin:0 0 6px;font-size:16px;font-weight:600}
.pp-about p{margin:0;color:var(--pp-muted);font-size:13.5px}
.pp-ai{margin:16px;padding:14px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--pp-ai1) 10%,transparent),color-mix(in srgb,var(--pp-ai2) 8%,transparent));animation:ppin .22s ease both}
.pp-ai-h{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.pp-ai-h small{margin-left:auto;font-weight:400;color:var(--pp-muted);font-size:11px}
.pp-ai .spark{color:var(--pp-ai1)}
.pp-ai ul{margin:10px 0 0;padding-left:18px;display:grid;gap:7px;font-size:13px}
.pp-ai li::marker{color:var(--pp-ai1)}
.disc{margin:12px 0 0;font-size:11px;color:var(--pp-muted)}
.pp-sig{margin:16px;border:1px solid var(--pp-line);border-radius:14px;padding:4px 14px 12px}
.pp-sig div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--pp-line);font-size:13.5px}
.pp-sig span{color:var(--pp-muted)}
.pp-sig b{font-weight:600}
.pp-cta{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 16px 26px;background:var(--pp-bg);border-top:1px solid var(--pp-line);margin-top:auto}
.pp-view:has(.pp-cta){display:flex;flex-direction:column}
.pp-btn{flex:1;height:44px;border-radius:999px;font-weight:500 !important;font-size:15px;display:inline-flex !important;align-items:center;justify-content:center;gap:8px;text-align:center !important}
.pp-btn.fill{background:var(--pp-teal) !important;color:var(--pp-on-teal) !important}
.pp-btn.line{border:1px solid var(--pp-text) !important}
.pp-btn.sm{height:34px;font-size:13px}
.pp-welcome{position:absolute;inset:0;display:flex;flex-direction:column;background:#2F2F33}
.pp-welcome{background:#2F2F33 url("img/ig/welcome-bg.jpg") center top/cover no-repeat}
.pp-welcome .photo{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;color:#fff;text-align:center;padding:0 40px 30px}
.pp-welcome .wl-logo{margin-top:132px;width:80px;height:auto;display:block}
.pp-welcome .wl-h{margin:54px 0 0;font-size:27px;font-weight:700;letter-spacing:-.2px;line-height:1.15;white-space:nowrap;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.pp-welcome .wl-p{margin:26px 0 0;font-size:15px;line-height:1.4;color:rgba(255,255,255,.92);text-shadow:0 1px 10px rgba(0,0,0,.3)}
.pp-welcome .sheet{background:#fff;color:#171717;border-radius:22px 22px 0 0;margin-top:-22px;position:relative;padding:14px 14px 34px;display:grid;gap:8px}
.pp-welcome .sheet .pp-btn.line{border-color:#171717 !important}
.pp-welcome .or{text-align:center;color:#7B7E84;font-size:12.5px;padding:6px 0}
.pp-welcome .skip{text-align:center !important;font-weight:500;padding:12px 0 0;font-size:15px}
.pp-seg2{display:flex;background:var(--pp-surface);border-radius:12px;padding:3px;margin:8px 16px 16px}
.pp-seg2 button{flex:1;padding:8px;border-radius:9px;font-size:13.5px;color:var(--pp-muted);text-align:center}
.pp-seg2 button[aria-pressed="true"]{background:var(--pp-bg);color:var(--pp-text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pp-amt{text-align:center;padding:6px 16px 0}
.pp-amt label{display:block;color:var(--pp-muted);font-size:12.5px;margin-bottom:8px}
.pp-amt .box{display:flex;align-items:center;justify-content:center;gap:14px}
.pp-amt .step{width:36px;height:36px;border-radius:50%;border:1px solid var(--pp-line) !important;font-size:20px;line-height:1;text-align:center !important}
.pp-amt .val{font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:150px}
.pp-amt .hint{margin-top:6px;font-size:12.5px;color:var(--pp-muted)}
.pp-quick{display:flex;gap:6px;justify-content:center;margin-top:12px}
.pp-quick button{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--pp-line) !important;color:var(--pp-muted)}
.pp-quick button[aria-pressed="true"]{border-color:var(--pp-text) !important;color:var(--pp-text);font-weight:600}
.pp-kv{margin:16px;border:1px solid var(--pp-line);border-radius:14px;overflow:hidden}
.pp-kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--pp-line);font-size:13.5px}
.pp-kv div:last-child{border-bottom:0}
.pp-kv span{color:var(--pp-muted)}
.pp-kv b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.pp-kv .tot b{font-weight:700}
.pp-kv .tot span{color:var(--pp-text);font-weight:600}
.pp-kv .hl{background:color-mix(in srgb, var(--pp-teal) 13%, transparent)}
.pp-kv .hl b{color:var(--pp-teal-ink);font-weight:600}
.pp-kv .pp-fixtag{display:inline-block;margin-left:6px;font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--pp-teal);color:var(--pp-on-teal);vertical-align:1px}
.pp-rev{display:flex;gap:12px;align-items:center;padding:8px 18px 0}
.pp-rev .pp-ic{width:36px;height:36px;font-size:14px}
.pp-rev b{display:block;font-size:16px;font-weight:600}
.pp-rev span{color:var(--pp-muted);font-size:13px}
.pp .dk p{color:var(--pp-text)}
.pp .dk .wl-p{color:rgba(255,255,255,.92)}
.pp .dk .disc,.pp .dk .pp-fine,.pp .dk .pp-about p{color:var(--pp-muted)}
.dk .pp-fine{margin:12px 16px 0;padding:0 2px;color:var(--pp-muted);font-size:12px;line-height:1.45;max-width:none}
.pp-acct{padding:24px 18px}
.pp-acct .lock{border:1.5px dashed var(--pp-line);border-radius:14px;padding:16px;color:var(--pp-muted);font-size:13.5px}
.pp-acct .lock b{color:var(--pp-text)}
.pp-nav{position:absolute;left:0;right:0;bottom:0;height:82px;padding-bottom:20px;display:flex;border-top:1px solid var(--pp-line);background:var(--pp-bg);z-index:4}
.dk.no-nav .pp-nav{display:none}
.pp-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;color:var(--pp-muted);text-align:center}
.pp-nav button svg{width:21px;height:21px}
.pp-nav button[aria-current="page"]{color:var(--pp-text);font-weight:600}
.pp-toast{position:absolute;left:50%;bottom:94px;transform:translate(-50%,8px);background:#262628;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;display:flex;gap:8px;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;z-index:5;box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
.dk[data-theme="dark"] .pp-toast{background:#3A3A3C}
.pp-toast.show{opacity:1;transform:translate(-50%,0)}
.pp-toast i{width:16px;height:16px;border-radius:50%;background:#1E9E3F;display:grid;place-items:center;font-style:normal;font-size:9px;color:#fff}
.pp-side{display:grid;gap:16px}
.pp-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pp-seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.pp-seg button{font:500 14px var(--body);border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.pp-seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.pp-reset{font:500 14px var(--body);border:1px solid #D0211F;background:#D0211F;color:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s}
.pp-reset:hover{background:#A91A19;border-color:#A91A19}
.pp-contrast{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.pp-contrast .mono{color:var(--muted);flex:1}
.pp-contrast b{font-size:18px;font-variant-numeric:tabular-nums}
.pp-badge{font:600 12px var(--mono);padding:3px 8px;border-radius:6px;background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent-ink)}
.pp-steps{display:flex;flex-wrap:wrap;gap:6px}
.pp-steps button{font:500 12.5px var(--body);border:1px solid var(--line);background:none;color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.pp-steps button[aria-current="step"]{border-color:var(--accent);color:var(--accent-ink);background:color-mix(in srgb, var(--accent) 10%, transparent)}
.pp-note{padding:16px;border-left:3px solid var(--accent);background:var(--paper);border-radius:0 10px 10px 0}
.pp-note .mono{color:var(--accent-ink)}
.pp-note h4{margin:6px 0 6px;font-size:17px;font-weight:600}
.pp-note p{margin:0;font-size:15px;color:var(--muted)}


/* Round 1: Overview matched to Figma */
.pp-hold{margin:0 16px;border-bottom:1px solid var(--pp-line)}
.dk .pp-hrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto 16px;grid-template-rows:24px 21px 21px;column-gap:10px;align-items:center;width:100%;padding:20px 0 18px}
.pp-hrow .pp-ic{grid-column:1;grid-row:1 / 4;align-self:center}
.pp-hrow .nm{grid-column:2 / 5;grid-row:1;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:52px}
.pp-hrow .tk{grid-column:2;grid-row:2;color:var(--pp-muted);font-size:14px}
.pp-hrow .vl{grid-column:3;grid-row:2;justify-self:end;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.pp-hrow .hc{grid-column:4;grid-row:2;display:flex;justify-content:flex-end;color:var(--pp-text)}
.pp-hrow .hc.up svg{transform:rotate(180deg)}
.pp-hrow .sh{grid-column:2;grid-row:3;color:var(--pp-muted);font-size:12.5px;white-space:nowrap}
.pp-hrow .pl{grid-column:3;grid-row:3;justify-self:end;font-size:11px;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.pp-hrow .pl i{font-style:normal}
.pp-hrow .pl i.sep{color:var(--pp-muted);margin:0 2px}
.pp-hrow:hover{background:none !important}
.pp-hx{padding:0 0 16px}
.pp-hxg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;background:var(--pp-surface);border-radius:12px;padding:12px 12px}
.pp-hxg div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pp-hxg span{font-size:12px;color:var(--pp-muted)}
.pp-hxg b{font-weight:400;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pp-hxa{display:flex;gap:12px;margin-top:12px}
.pp-hxa .pp-btn{height:38px;font-size:15px}

/* Round 2: My orders flow */
.pp-oseg{display:flex;background:var(--pp-surface);border-radius:999px;padding:4px;margin:12px 16px 4px}
.dk .pp-oseg button{flex:1;text-align:center;padding:8px 0;border-radius:999px;font-size:13.5px;color:var(--pp-muted)}
.dk .pp-oseg button[aria-selected="true"]{background:var(--pp-bg);color:var(--pp-text);font-weight:600}
.pp-odate{padding:18px 16px 6px;color:var(--pp-muted);font-size:13.5px;font-weight:500}
.pp-ord{position:relative;margin:0 16px;border-bottom:1px solid var(--pp-line)}
.pp-ord:last-of-type{border-bottom:0}
.dk .pp-orow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;grid-template-rows:24px 20px 20px 18px;column-gap:10px;align-items:center;width:100%;padding:16px 0 14px}
.pp-orow .pp-ic{grid-column:1;grid-row:1 / 5}
.pp-orow .nm{grid-column:2 / 4;grid-row:1;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.pp-orow .tk{grid-column:2;grid-row:2;color:var(--pp-muted);font-size:13.5px}
.pp-orow .by{grid-column:2;grid-row:3;font-size:13px}
.pp-orow .dt{grid-column:2;grid-row:3;color:var(--pp-muted);font-size:12px;white-space:nowrap}
.pp-orow .lo{grid-column:3;grid-row:3;justify-self:end;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pp-orow .fi{grid-column:3;grid-row:3;justify-self:end;font-size:12px;color:var(--pp-muted);white-space:nowrap}
.pp-ost{position:absolute;right:0;top:40px;height:20px;display:flex;align-items:center;font-size:13px}
.pp-ost .mut{color:var(--pp-muted)}
.dk .pp-olink{color:#1F5FD6;text-decoration:underline;text-underline-offset:2px;font-weight:600;font-size:13px}
.dk[data-theme="dark"] .pp-olink{color:#6FA0FF}
.pp-oempty{text-align:center;padding:40px 24px;display:flex;flex-direction:column;gap:6px}
.pp-oempty b{font-size:15px;font-weight:600}
.pp-oempty span{font-size:13px;color:var(--pp-muted)}
.pp-odh{padding:6px 16px 14px;font-size:16px}
.pp-odh b{font-weight:700}
.pp-odh span{color:var(--pp-muted);font-size:13px}
.pp-odl{margin:0 16px}
.pp-odl div{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--pp-line);font-size:14px;min-height:44px}
.pp-odl span{color:var(--pp-muted)}
.pp-odl b{font-weight:400;font-variant-numeric:tabular-nums}
.pp-stag{display:inline-block;padding:4px 9px;border-radius:5px;font-size:12px}
.pp-stag.pr{background:#FFE6D2;color:#B54708}
.pp-stag.ok{background:#CFF7D6;color:#137A2E}
.pp-stag.cx{background:var(--pp-surface);color:var(--pp-muted)}
.pp-cta.noline{border-top:0}
.pp-btn.dark{background:#171717 !important;color:#fff !important}
.dk[data-theme="dark"] .pp-btn.dark{background:#D4D4D4 !important;color:#171717 !important}
.pp-sheetwrap{position:absolute;inset:0;z-index:7;display:none}
.pp-sheetwrap.open{display:block}
.pp-sdim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.pp-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--pp-bg);border-radius:20px 20px 0 0;padding:10px 16px 34px;display:flex;flex-direction:column;gap:10px;animation:ppsheet .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes ppsheet{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.pp-sheet .pp-btn{flex:none;height:46px}
.pp-sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--pp-line);margin:0 auto 6px;display:block}
.pp-sheet h5{margin:0;font-size:18px;font-weight:700}
.pp-sheet p{margin:0 0 6px;font-size:14px;line-height:1.4}
.dk .pp-goback{text-align:center;padding:10px 0 0;font-weight:500;font-size:15px}

/* Round 3: Past activity */
.pp-oseg.two button{padding:8px 0}
.pp-tx{display:flex;justify-content:space-between;gap:12px;margin:0 16px;padding:14px 0;border-bottom:1px solid var(--pp-line)}
.pp-tx:last-child{border-bottom:0}
.pp-tx .l{display:flex;flex-direction:column;min-width:0}
.pp-tx .h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.pp-tx .h b{font-weight:500;font-size:16px}
.pp-ttag{font-size:12px;padding:3px 8px;border-radius:4px;background:var(--pp-surface);color:var(--pp-text)}
.pp-tx .tk{color:var(--pp-muted);font-size:13.5px;line-height:22px}
.pp-tx .dt{color:var(--pp-muted);font-size:12.5px;line-height:20px;margin-top:2px}
.pp-tx .de{color:var(--pp-muted);font-size:12.5px;line-height:18px}
.pp-tx .am{font-weight:500;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:1px}

/* Round 4: Search flow */
.dk .pp-sfake{display:flex;align-items:center;gap:10px;margin:2px 16px 0;width:calc(100% - 32px);border:1px solid var(--pp-line);border-radius:999px;padding:11px 14px;color:var(--pp-muted);font-size:14.5px}
.pp-sh2{padding:22px 16px 10px;font-size:19px;font-weight:700;letter-spacing:-.01em}
.pp-icards{display:flex;gap:8px;padding:14px 0 0 16px;overflow-x:auto;scrollbar-width:none}
.pp-icards::-webkit-scrollbar{display:none}
.dk .pp-icard{flex:none;width:186px;height:186px;border-radius:8px;overflow:hidden;position:relative}
.pp-icard .art{position:absolute;inset:0}
.pp-icard.div .art{background:repeating-linear-gradient(100deg,#DCEFF3 0 16px,#F4E1D6 16px 30px,#E9F3DD 30px 44px,#F1E6F4 44px 58px,#E3EBF7 58px 74px)}
.pp-icard.div .art::after{content:"€";position:absolute;right:16px;top:10px;font-size:84px;font-weight:800;color:rgba(30,70,90,.16);line-height:1}
.pp-icard.ai .art{background:radial-gradient(120% 90% at 70% 30%,#7B4BFF 0,#3A1E9E 45%,#130A3F 100%)}
.pp-icard.ai .art::before{content:"";position:absolute;left:28%;top:22%;width:64%;height:56%;border-radius:10px;background:linear-gradient(135deg,#9B7BFF,#5B3BE0);box-shadow:0 0 0 6px rgba(140,110,255,.25),0 0 40px rgba(120,90,255,.6)}
.pp-icard.ai .art::after{content:"AI";position:absolute;left:44%;top:31%;font-size:52px;font-weight:800;color:rgba(255,255,255,.85);font-style:italic}
.pp-icard.etf1 .art{background:linear-gradient(135deg,#0E7F77,#22D3C5)}
.pp-icard.etf2 .art{background:linear-gradient(135deg,#1B2B6B,#4A6CF0)}
.pp-icard .lb{position:absolute;left:14px;bottom:14px;background:#fff;color:#171717;border-radius:999px;padding:6px 12px;font-size:14px}
.pp-opps{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.dk .pp-opp{display:flex;align-items:center;gap:8px;background:#FAFAFA;border-radius:8px;padding:12px 10px;font-size:13.5px;min-height:62px}
.dk[data-theme="dark"] .pp-opp{background:var(--pp-surface)}
.pp-opp .ci{width:38px;height:38px;border-radius:50%;background:var(--pp-bg);display:grid;place-items:center;flex:none;color:var(--pp-text)}
.pp-sqv{position:absolute;inset:0;display:flex;flex-direction:column}
.pp-sqv .res{flex:1;overflow-y:auto;scrollbar-width:none}
.pp-sqv .res::-webkit-scrollbar{display:none}
.dk .pp-field .clr{width:20px;height:20px;font-size:13px;color:var(--pp-text);flex:none;text-align:center}
.pp-kb{background:#D1D3D9;padding:8px 3px 30px;display:grid;gap:9px;flex:none}
.dk[data-theme="dark"] .pp-kb{background:#2B2B2D}
.pp-kb .kr{display:flex;gap:5px;justify-content:center}
.pp-kb .kr.r2{padding:0 14px}
.dk .pp-kb button{flex:1;max-width:30px;height:40px;border-radius:5px;background:#fff;color:#111;font-size:18px;box-shadow:0 1px 0 rgba(0,0,0,.3);text-align:center}
.dk[data-theme="dark"] .pp-kb button{background:#5A5A5E;color:#fff}
.dk .pp-kb button.fn{background:#ABAFB8;max-width:40px;font-size:15px}
.dk[data-theme="dark"] .pp-kb button.fn{background:#3E3E41}
.dk .pp-kb button.w{max-width:84px;font-size:14px}
.dk .pp-kb button.sp{max-width:none;flex:3;font-size:14px}
.pp-oph{padding:6px 16px 6px}
.pp-oph b{display:block;font-size:17px;font-weight:700}
.dk .pp-keyb{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-top:2px}
.pp-ic.ph{background:var(--pp-surface);box-shadow:inset 0 0 0 1px var(--pp-line)}
.dk .pp-row.oprow{margin:0 16px;width:calc(100% - 32px);padding:11px 0}
.pp-sheet h6{margin:4px 0 0;font-size:14px;font-weight:600}
.pp-sheet p{white-space:normal}

/* Round 5: market details tabs */
.md-tabs{overflow-x:auto;scrollbar-width:none;gap:0;padding-top:16px}
.md-tabs::-webkit-scrollbar{display:none}
.dk .md-tabs button{flex:none;padding:0 14px 11px;gap:6px;font-size:14px}
.md-body{flex:1}
.md-pad{padding:6px 16px 22px}
.md-svg{width:100%;height:auto;display:block;overflow:visible}
.md-svg .gl{stroke:#E6E6E6;stroke-width:1}
.md-svg .ax{font:400 9.5px var(--body);fill:#9AA0A6}
.md-svg .ax.g{fill:#8C9196}
.md-svg .ax.d{fill:var(--pp-text)}
.md-svg .gl-t{font:500 10.5px var(--body)}
.md-svg .gl-v{font:700 14px var(--body);fill:var(--pp-text)}
.md-svg .rd-v{font:600 14px var(--body)}
.md-svg .rd-l{font:400 10.5px var(--body);fill:var(--pp-text)}
.md-svg .rg-l{font:600 10px var(--body);fill:#8C9196}
.md-svg .rg-v{font:600 12px var(--body);fill:var(--pp-text)}
.md-svg .cs-t{font:600 10px var(--body);fill:#fff}
.md-svg .cs-t.sm{font-size:9.5px}
.md-et th{white-space:nowrap}
.md-svg .cs-x{font:500 10.5px var(--body);fill:var(--pp-text)}
.md-svg .tp-l{font:400 10.5px var(--body);fill:var(--pp-text)}
.md-h{margin:22px 0 10px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px}
.md-h.big{margin-top:16px;font-size:18px}
.md-pad>.md-h:first-child{margin-top:16px}
.md-i{display:inline-flex;color:var(--pp-text)}
.md-prof{margin:0;font-size:13.5px;line-height:1.42;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}

  function modal(){
    if(!S.modal) return '';
    var m=S.modal,x='<button type="button" class="x" data-mclose aria-label="Close">'+ico('<path d="M6 6l12 12M18 6L6 18"/>')+'</button>',c;
    if(m==='cancel') c='<h5>Cancel order</h5><p>Are you sure you want to cancel this order? This action can’t be undone.</p><div class="acts"><button type="button" class="btn" data-mclose>Go back</button><button type="button" class="btn fill" data-ocxok>Cancel order</button></div>';
    else if(m==='keys'){var k=ALLC.filter(function(z){return z[0]===S.cat;})[0][4];c='<h5>Key investment points</h5><h6>Advantages</h6><p>'+k.adv+'</p><h6>Risks</h6><p>'+k.risk+'</p><div class="acts"><button type="button" class="btn fill" data-mclose>Got it</button></div>';}
    else if(m==='senti') c='<h5>Sentiment</h5><h6>What this shows</h6><p>Real-time sentiment analysis based on news, social media, and other public sources.</p><h6>Reading the data</h6><p><b>Sentiment Gauge:</b> Ranges from -1.00 (Extreme Bearish) to +1.00 (Extreme Bullish)</p>'+gaugeSVG(0.4,{ann:1})+buzzSVG('24h')+'<p><b>Time Periods:</b> Shows sentiment trends over 24 hours, 7 days, 30 days, and 90 days</p><p><b>Media Buzz Chart:</b> Bars show how much the stock is being discussed throughout the day</p>';
    else if(m==='acct') c='<h5>Switch account</h5><div class="ordl">'+[['Investments','Shares and ETFs · 0% commission',1],['Trading','CFDs and options',0],['Demo account','Practise with virtual funds',0]].map(function(a){return '<button type="button" data-acc="'+a[0]+'"><span><b style="font-weight:600">'+a[0]+'</b><br><span class="mu">'+a[1]+'</span></span>'+(a[2]?'<b>✓</b>':'')+'</button>';}).join('')+'</div>';
    return '<div class="modal" data-mbg><div class="box" role="dialog" aria-modal="true">'+x+c+'</div></div>';
  }
  function dropdown(){
    if(!S.dd) return '';var q=S.q.trim().toLowerCase(),ids=q?Object.keys(A).filter(function(k){return A[k].n.toLowerCase().indexOf(q)>-1||k.toLowerCase().indexOf(q)>-1;}).slice(0,8):POPULAR;
    return '<div class="dk-dd" role="listbox"><div class="h">'+(q?'Search results':'Popular assets')+'</div>'+(ids.length?ids.map(function(k){var a=A[k];return '<button type="button" role="option" data-open="'+k+'">'+logo(a)+'<span class="n"><b>'+a.n+'</b><span>'+k+'</span></span><span class="p">'+eur(a.p)+'<span class="'+cls(a.c)+'">'+pct(a.c)+'</span></span></button>';}).join(''):'<div class="empty">No matches for “'+S.q.replace(/</g,'')+'”</div>')+'</div>';
  }

  function render(){
    var pg=S.pg,rail=pg==='overview'?overviewRail():pg==='market'?ticket():null,c={overview:overview,search:search,market:market,orders:orders,past:past}[pg]();
    var nprog=S.ord.filter(function(o){return o.st==='progress';}).length;
    var cs=root.querySelector('.dk-c'),keep=cs&&cs.dataset.pg===pg?cs.scrollTop:0;
    root.innerHTML='<aside class="dk-side"><div class="dk-logo">'+LOGO+'INVESTMENTS</div>'+NAV.map(function(n){var cur=pg===n[0]||(pg==='market'&&S.back===n[0]);return '<button type="button" class="dk-nav" data-go="'+n[0]+'"'+(cur?' aria-current="page"':'')+'>'+ico(n[2])+n[1]+(n[0]==='orders'&&nprog?'<span class="cnt">'+nprog+'</span>':'')+'</button>';}).join('')+'<div class="dk-sp"></div><button type="button" class="dk-nav" data-toast="Account isn’t part of this prototype">'+ico('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>')+'Account</button></aside>'+
      '<div class="dk-main"><div class="dk-top"><div class="dk-q"><label>'+ico(MAG)+'<input id="dk-q" type="search" autocomplete="off" placeholder="Search shares or companies" value="'+S.q.replace(/"/g,'')+'" aria-label="Search shares or companies"></label>'+dropdown()+'</div><div class="dk-tsp"></div><button type="button" class="btn sm" data-toast="Add funds isn’t part of this prototype">Add funds</button><button type="button" class="acct" data-acct><span class="av">KV</span><span class="sm">Investments</span>'+ico('<path d="M6 9l6 6 6-6"/>')+'</button></div>'+
      '<div class="dk-body'+(rail?'':' full')+'"><div class="dk-c" data-pg="'+pg+'">'+c+'</div>'+(rail?'<aside class="dk-r">'+rail+'</aside>':'')+'</div></div>'+modal()+'<div class="dk-toast" id="dk-toast" role="status"></div>';
    toastEl=document.getElementById('dk-toast');
    document.getElementById('dk-url').textContent='invest.ig.com/'+(pg==='market'?'markets/'+S.asset.id.toLowerCase():pg==='past'?'activity':pg);
    var ncs=root.querySelector('.dk-c');if(ncs)ncs.scrollTop=keep;
    var mt=root.querySelector('.md-tabs');if(mt){var sb=mt.querySelector('[aria-selected="true"]');}
    bindCharts();
  }
  function bindCharts(){
    root.querySelectorAll('svg.lchart').forEach(function(svg){
      var id=svg.dataset.ch;if(id==='mini')return;
      var wrap=svg.parentNode;
      function make(hi){var pts=id==='pf'?pfPts():mPts(S.asset);return id==='pf'?lchart(pts,{id:'pf',h:200,label:'Portfolio value',hi:hi,fmt:function(v){return Math.round(v).toLocaleString('de-DE')+'€';},xl:XL[S.pr]}):lchart(pts,{id:'m',h:240,label:S.asset.n+' price chart',color:'#7B6CF0',hi:hi,xl:XL[S.mr]});}
      function at(e){var s=wrap.querySelector('svg'),r=s.getBoundingClientRect(),vb=s.viewBox.baseVal,x=(e.clientX-r.left)/r.width*vb.width,n=(id==='pf'?pfPts():mPts(S.asset)).length,pr=52;return Math.max(0,Math.min(n-1,Math.round((x-4)/(vb.width-pr-8)*(n-1))));}
      wrap.addEventListener('pointermove',function(e){wrap.innerHTML=make(at(e));});
      wrap.addEventListener('pointerleave',function(){wrap.innerHTML=make(null);});
    });
  }
  function toast(m){toastEl.innerHTML='<i>✓</i>'+m;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.classList.remove('show');},2600);}
  function go(p){S.pg=p;S.dd=false;S.modal=null;render();var c=root.querySelector('.dk-c');if(c)c.scrollTop=0;}
  function openAsset(k){S.back=S.pg==='market'?S.back:S.pg;S.asset=A[k];S.mtab='summary';S.tk={side:'buy',type:'market',amt:250,step:'form'};S.q='';go('market');}

  root.addEventListener('click',function(e){
    var t=e.target.closest('button,tr[data-open]');if(!t||!root.contains(t))return;var d=t.dataset;
    var allowed=d.sel||d.hk||d.pr||d.toast||d.go==='overview'||('mclose' in d);
    if(!allowed){e.stopImmediatePropagation();e.preventDefault();toast('This preview shows the Overview. Try the mobile prototype for the full journey');}
  },true);
  root.addEventListener('focusin',function(e){if(e.target.id==='dk-q'){e.stopImmediatePropagation();e.target.blur();toast('This preview shows the Overview. Try the mobile prototype for the full journey');}},true);
  root.addEventListener('click',function(e){
    if(e.target.matches('[data-mbg]')){S.modal=null;render();return;}
    var t=e.target.closest('button,tr[data-sel],tr[data-open]');
    if(!t||!root.contains(t)){if(S.dd&&!e.target.closest('.dk-q')){S.dd=false;render();}return;}
    var d=t.dataset;
    if(S.dd&&!t.closest('.dk-dd')&&t.id!=='dk-q'){S.dd=false;}
    if(d.trade){S.back=S.pg==='market'?S.back:S.pg;S.asset=A[d.a||S.asset.id];S.tk={side:d.trade,type:'market',amt:250,step:'form'};S.mtab=S.pg==='market'?S.mtab:'summary';S.pg='market';render();e.stopPropagation();return;}
    if(d.open){openAsset(d.open);return;}
    if(d.go){go(d.go);return;}
    if(d.sel){S.sel=d.sel;render();return;}
    if(d.hk){if(S.hk===d.hk)S.hdir*=-1;else{S.hk=d.hk;S.hdir=d.hk==='name'?1:-1;}render();return;}
    if(d.pr){S.pr=d.pr;render();return;}
    if(d.mr){S.mr=d.mr;render();return;}
    if('cat' in d){S.cat=d.cat||null;render();var cc=document.getElementById('cat-card');if(cc)cc.scrollIntoView({block:'nearest'});return;}
    if('keys' in d){S.modal='keys';render();return;}
    if(d.mtab){S.mtab=d.mtab;render();return;}
    if('senti' in d){S.modal='senti';render();return;}
    if('mclose' in d){S.modal=null;render();return;}
    if('acct' in d){S.modal='acct';render();return;}
    if(d.acc){S.modal=null;render();if(d.acc!=='Investments')toast(d.acc+' isn’t part of this prototype');return;}
    if(d.toast){toast(d.toast);return;}
    if(d.tside){S.tk.side=d.tside;render();return;}
    if(d.ttype){S.tk.type=d.ttype;render();return;}
    if(d.tamt){S.tk.amt=Math.max(50,Math.min(5000,S.tk.amt+parseInt(d.tamt,10)));render();return;}
    if(d.tset){S.tk.amt=parseInt(d.tset,10);render();return;}
    if(d.tstep){S.tk.step=d.tstep;render();return;}
    if('confirm' in d){var T=S.tk,a=S.asset,now=new Date(),dd=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'),tt=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),px=T.type==='limit'?Math.round(a.p*0.98*100)/100:a.p,q=Math.max(1,Math.floor(T.amt/px)),mk=T.type==='market';
      S.ord.unshift({id:'n'+Date.now(),a:a.id,qty:q,lim:px,d:dd,t:tt,filled:mk?q:0,st:mk?'completed':'progress',side:T.side});
      if(mk)S.tx.unshift({n:a.n,tag:T.side==='sell'?'Sell':'Buy',tk:a.id,d:dd.split('-').reverse().join('/')+', '+tt,det:q+' units at '+eur(px),amt:(T.side==='sell'?1:-1)*q*px});
      S.oseg=mk?'completed':'progress';S.tk.step='done';render();toast(mk?'Order placed':'Limit order placed');return;}
    if(d.oseg){S.oseg=d.oseg;render();return;}
    if(d.pseg){S.pseg=d.pseg;render();return;}
    if(d.ocx){S.oid=d.ocx;S.modal='cancel';render();e.stopPropagation();return;}
    if('ocxok' in d){S.ord.filter(function(o){return o.id===S.oid;})[0].st='canceled';S.modal=null;S.oseg='canceled';render();toast('Order canceled');return;}
    /* md module controls */
    if(d.sp){S.sp=d.sp;render();return;}
    if('more' in d){S.more=!S.more;render();return;}
    if(d.cmk){S.cmk=d.cmk;S.cpg=S.cmk==='us'?18:1;render();return;}
    if('csort' in d){S.cdesc=!S.cdesc;render();return;}
    if(d.cpg){var lp=S.cmk==='us'?53:247,v=d.cpg;S.cpg=v==='prev'?Math.max(1,S.cpg-1):v==='next'?Math.min(lp,S.cpg+1):+v;render();return;}
    if(S.dd){render();}
  });
  root.addEventListener('focusin',function(e){if(e.target.id==='dk-q'&&!S.dd){S.dd=true;render();var q=document.getElementById('dk-q');q.focus();q.setSelectionRange(q.value.length,q.value.length);}});
  root.addEventListener('input',function(e){if(e.target.id==='dk-q'){S.q=e.target.value;S.dd=true;var pos=e.target.selectionStart;render();var q=document.getElementById('dk-q');q.focus();q.setSelectionRange(pos,pos);}});
  root.addEventListener('change',function(e){if(e.target.id==='md-csel'){S.cper=e.target.value;render();}});
  root.addEventListener('keydown',function(e){if(e.key==='Escape'){if(S.modal){S.modal=null;render();}else if(S.dd){S.dd=false;S.q='';render();}}if(e.key==='Enter'&&e.target.id==='dk-q'){var b=root.querySelector('.dk-dd [data-open]');if(b)openAsset(b.dataset.open);}if(e.key==='Enter'&&e.target.matches('tr[data-sel],tr[data-open]'))e.target.click();});
  render();

})();
</script>
</body></html>
